[project]
name = "inferstack"
version = "0.1.0"
description = "A self-hosted LLM inference stack: serving, gateway, observability and performance engineering."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }

# Core dependencies are deliberately small and pure-Python so that `inferstack`
# installs on Windows, in a slim container, and inside a Colab/Kaggle cell.
# Anything heavy (engines, plotting, web server) lives behind an extra.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Phase 2 - the API layer in front of the engine
gateway = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "prometheus-client>=0.20",
]
# Phase 4 - load generation and results analysis. No tokenizer here on
# purpose: prompt and completion token counts are read from the server's own
# usage block, which is the only source that cannot disagree with the engine
# being measured.
bench = [
    "matplotlib>=3.8",
]
# Phase 1 - the engine itself. vLLM publishes Linux wheels only, so the marker
# keeps `uv lock` and `pip install -e ".[dev]"` working on the Windows dev box.
engine = [
    "vllm>=0.6.0; sys_platform == 'linux'",
]
# Phase 1 - driving free-tier GPU sessions (Kaggle kernels) from code.
remote = [
    "kaggle>=1.7",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
    "kaggle>=1.7",
]

[project.scripts]
inferstack = "inferstack.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inferstack"]

# Execution profiles are the source of truth for how a machine is configured, so
# an installed wheel must carry them. Without this, `inferstack doctor` works in
# a checkout and fails everywhere else - including inside the GPU session that
# pip-installs this package.
[tool.hatch.build.targets.wheel.force-include]
"configs/profiles" = "inferstack/profiles"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # import sorting
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "S",             # bandit: this project ships a network service
    "BLE",           # no accidental blind excepts
]
ignore = ["B008"]  # typer uses function calls in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101"]  # asserts are the point of a test
# Standalone diagnostic scripts pushed to a remote session: they must report
# every failure rather than propagate it, and PATH lookups are correct there.
"src/inferstack/remote/kernels/*" = ["S603", "S607", "BLE001"]

[tool.mypy]
python_version = "3.11"
packages = ["inferstack"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Third-party stubs are not ours to type-check. numpy's in particular use
# `type` statements, which are 3.12 syntax, so following them fails the whole
# run against this project's 3.11 floor - an error about a dependency's stubs
# rather than about this code.
[[tool.mypy.overrides]]
# Both forms: `numpy.*` matches submodules but not `numpy` itself, which is
# the file that actually fails to parse.
module = ["numpy", "numpy.*", "matplotlib", "matplotlib.*", "pandas", "pandas.*"]
follow_imports = "skip"
# follow_imports alone is not enough: by default it does not apply to .pyi
# files, and a stub is exactly what fails here.
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires a running engine or gateway",
    "gpu: requires an NVIDIA GPU",
    "slow: takes more than a few seconds",
]
