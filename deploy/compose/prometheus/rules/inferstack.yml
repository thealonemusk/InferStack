# Alerting and recording rules for InferStack.
#
# The two latency thresholds are MEASURED, for one stated target: the
# interactive SLO (TTFT < 1 s, TPOT < 50 ms) on the colab-t4 profile, from the
# Phase 5 baseline (artifacts/curated/phase05/). A latency target is still a
# product decision - an overnight batch job would set both far looser - so a
# different SLO or a different GPU means re-measuring, not editing a number.
#
# What is not a matter of taste is *which* conditions are worth an alert. Each
# rule below fires on a cause, not on a symptom, because "p99 is high" is a
# statement nobody can act on and "the KV cache is full so the scheduler is
# preempting" is.

groups:
  - name: inferstack.recording
    interval: 15s
    rules:
      # Recorded once so the dashboard, the alerts and `inferstack metrics` all
      # quote the same arithmetic. A percentile computed two ways is a
      # percentile that will eventually disagree with itself.
      - record: inferstack:ttft_seconds:p99
        expr: >-
          histogram_quantile(
            0.99,
            sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le)
          )
      # request_time_per_output_token_seconds, not time_per_output_token_seconds:
      # the latter does not exist in vLLM 0.29.0, and a recording rule over a
      # metric nobody emits evaluates to nothing forever without ever erroring.
      - record: inferstack:tpot_seconds:p99
        expr: >-
          histogram_quantile(
            0.99,
            sum(rate(vllm:request_time_per_output_token_seconds_bucket[5m])) by (le)
          )
      # ITL is a different question from TPOT: the gap between tokens, rather
      # than that gap averaged within a request.
      - record: inferstack:itl_seconds:p99
        expr: >-
          histogram_quantile(
            0.99,
            sum(rate(vllm:inter_token_latency_seconds_bucket[5m])) by (le)
          )

  - name: inferstack.availability
    rules:
      - alert: EngineDown
        expr: up{job="vllm"} == 0
        for: 1m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: "The inference engine is not answering scrapes"
          description: >-
            Prometheus cannot reach vLLM's /metrics. The gateway will be
            returning 502 to callers. Note this is the engine's own port, not
            the gateway's - a healthy gateway proves nothing about the engine.

      - alert: GatewayDown
        expr: up{job="inferstack-gateway"} == 0
        for: 1m
        labels:
          severity: critical
          component: gateway
        annotations:
          summary: "The gateway is not answering scrapes"
          description: >-
            Callers cannot reach the engine, and the engine's own metrics are
            still being scraped separately (ADR-0007), so check those to tell a
            gateway fault from an engine one.

  - name: inferstack.saturation
    rules:
      - alert: KVCacheNearlyFull
        expr: max(vllm:kv_cache_usage_perc or vllm:gpu_cache_usage_perc) > 0.9
        for: 5m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: "KV cache above 90% - preemption is next"
          description: >-
            The KV cache is the real concurrency limit, not parameter count.
            Above ~90% the scheduler starts evicting sequences and recomputing
            them, which is where p99 spikes come from. Either reduce
            max_num_seqs, reduce max_model_len, or add capacity.

      - alert: EnginePreempting
        expr: rate(vllm:num_preemptions_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: "The engine is evicting and recomputing sequences"
          description: >-
            Sustained preemption means admitted work is being thrown away and
            done twice. Throughput will look acceptable while tail latency does
            not. Check KVCacheNearlyFull first - this is usually its consequence.

      - alert: QueueDepthSustained
        expr: min_over_time(vllm:num_requests_waiting[10m]) > 0
        for: 10m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: "The engine queue has not been empty for 10 minutes"
          description: >-
            min_over_time, not avg: a queue that never empties means arrivals
            are exceeding the service rate, and by Little's Law the wait grows
            without bound until something sheds. A queue that merely spikes is
            normal and does not fire this.

  - name: inferstack.gateway
    rules:
      - alert: GatewaySheddingLoad
        expr: rate(inferstack_gateway_rejected_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "The gateway is refusing requests with 429"
          description: >-
            Admission control is doing its job, which means demand exceeds
            configured capacity. Shedding is deliberate - a fast 429 is kinder
            than a slow 504 - but sustained shedding is a capacity decision, not
            a transient. Check queue depth and KV cache before raising
            max_concurrent_requests, or the queue simply moves into the engine.

      - alert: GatewayAtCapacity
        expr: >-
          inferstack_gateway_in_flight_requests
            >= inferstack_gateway_capacity_requests
        for: 5m
        labels:
          severity: info
          component: gateway
        annotations:
          summary: "In-flight requests are pinned at the configured ceiling"
          description: >-
            The gateway, not the engine, is the current limit. Fires before
            GatewaySheddingLoad does, because requests can still be waiting
            within the queue budget rather than being refused.

      - alert: StreamsBeingAbandoned
        expr: rate(inferstack_gateway_streams_disconnected_total[5m]) > 0.1
        for: 10m
        labels:
          severity: info
          component: gateway
        annotations:
          summary: "Clients are hanging up mid-stream"
          description: >-
            On a continuously-batched engine an abandoned request holds its slot
            in the running batch until the upstream connection drops, so it
            steals throughput from live requests. A rising rate usually means
            client-side timeouts are shorter than the generation takes.

  - name: inferstack.latency
    rules:
      - alert: TimeToFirstTokenSlow
        expr: inferstack:ttft_seconds:p99 > 1
        for: 10m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: "p99 TTFT above the 1s interactive SLO"
          description: >-
            MEASURED (Phase 5, colab-t4, interactive SLO). At the sustainable
            16.5 req/s p99 TTFT was 153 ms, so this fires well past the healthy
            region. With max_num_seqs=256 TTFT is the second signal to go, after
            TPOT; with a lower cap it is the first, and it is queue time - check
            vllm:num_requests_waiting before blaming prefill.

      - alert: TimePerOutputTokenSlow
        expr: inferstack:tpot_seconds:p99 > 0.05
        for: 10m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: "p99 TPOT above the 50ms/token interactive SLO"
          description: >-
            MEASURED (Phase 5, colab-t4, interactive SLO). This is the signal
            that breaks first: p99 TPOT was 42 ms at the sustainable 16.5 req/s
            and 65 ms at 20 req/s, with the queue still empty, because the
            running batch grows instead. Headroom is thin by design - this
            fires at the edge of capacity, not after it.
