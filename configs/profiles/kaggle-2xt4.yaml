# Kaggle notebooks: 2x Tesla T4, ~30 GPU-hours per week, 12 hour sessions.
#
# Same Turing constraints as colab-t4, with one extra capability that matters:
# two devices means tensor parallelism is genuinely measurable in Phase 6.
#
# Caveat to record with any TP=2 result: these T4s communicate over PCIe, not
# NVLink, so all-reduce cost is higher than on an NVLink-connected pair. A
# sub-linear speedup here is expected, not a bug.
description: "Kaggle: 2x Tesla T4 (SM 7.5, 16 GB each, PCIe)"

engine:
  backend: vllm
  model: Qwen/Qwen2.5-1.5B-Instruct
  served_model_name: qwen2.5-1.5b
  device: cuda
  dtype: float16
  host: 127.0.0.1
  port: 8000

  max_model_len: 4096
  gpu_memory_utilization: 0.90
  swap_space_gb: 4
  kv_cache_dtype: auto

  max_num_seqs: 256
  max_num_batched_tokens: 8192
  enable_chunked_prefill: true
  enable_prefix_caching: false

  tensor_parallel_size: 2
  quantization: null

gateway:
  host: 127.0.0.1
  port: 8080
  require_auth: false
  request_timeout_s: 300.0
  max_concurrent_requests: 512

observability:
  log_level: INFO
  log_format: json

bench:
  artifacts_dir: artifacts/runs
  warmup_requests: 8
