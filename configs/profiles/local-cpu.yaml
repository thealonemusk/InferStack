# Local development profile: no GPU required.
#
# Purpose: correctness, API shape, wiring and CI. The vLLM CPU backend runs the
# real scheduler and real continuous batching, so every code path exercised here
# is the same one that runs on a GPU - only the kernels differ.
#
# NOT for performance numbers. Anything measured here is meaningless as a
# throughput claim.
description: "CPU-only development loop (no GPU required)"

engine:
  backend: vllm
  model: Qwen/Qwen2.5-0.5B-Instruct
  served_model_name: qwen2.5-0.5b
  device: cpu
  # AVX2-only CPUs have no bfloat16 units; float32 is the portable choice.
  dtype: float32
  host: 127.0.0.1
  port: 8000

  max_model_len: 2048
  swap_space_gb: 2

  # Small batch: on CPU the bottleneck is compute, not KV cache capacity.
  max_num_seqs: 16
  max_num_batched_tokens: 2048
  enable_prefix_caching: false

  tensor_parallel_size: 1
  quantization: null

gateway:
  host: 127.0.0.1
  port: 8080
  require_auth: false
  request_timeout_s: 600.0
  max_concurrent_requests: 32

observability:
  log_level: DEBUG
  log_format: console

bench:
  artifacts_dir: artifacts/runs
  warmup_requests: 2
